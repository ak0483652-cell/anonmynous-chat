<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traffic sources</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1b2320;--mute:#68736e;--line:#dfe4de;--bar:#1f7a5c;--bar2:#b9d9cc;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2220;--ink:#e8eeea;--mute:#8a9892;--line:#2b3733;--bar:#4cc29a;--bar2:#254a3d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:20px;max-width:900px;margin-inline:auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}p{margin:0;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer}button.on{background:var(--bar);color:#fff;border-color:var(--bar)}
.top{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.row{display:grid;grid-template-columns:110px 1fr 56px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--bar2);border-radius:4px;height:10px}.fill{background:var(--bar);height:10px;border-radius:4px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.days{display:flex;align-items:flex-end;gap:3px;height:80px}.days i{flex:1;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px}
#err{color:#c0392b;margin-top:8px}
</style>
</head>
<body>
<h1>Traffic sources</h1>
<p id="lead">Key daalo aur dekho visitors kahaan se aa rahe hain.</p>
<div class="bar" id="login">
	<input id="api" placeholder="API URL (https://...onrender.com)" size="30">
	<input id="key" type="password" placeholder="ANALYTICS_KEY">
	<button id="go">Dekho</button>
</div>
<div id="err"></div>
<div id="out" hidden>
	<div class="bar" id="range"></div>
	<div class="card"><div class="top" id="topsrc"></div><p id="sub"></p></div>
	<div class="card"><h2>Sources</h2><div id="sources"></div></div>
	<div class="grid">
		<div class="card"><h2>Pages</h2><div id="pages"></div></div>
		<div class="card"><h2>Countries</h2><div id="countries"></div></div>
		<div class="card"><h2>Devices</h2><div id="devices"></div></div>
	</div>
	<div class="card"><h2>Visits per day</h2><div class="days" id="daily"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
let days=7;
try{$("api").value=sessionStorage.getItem("sr_api")||location.origin;$("key").value=sessionStorage.getItem("sr_key")||""}catch{}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rows(el,list,label){
	const max=Math.max(1,...list.map(x=>x.visits));
	el.innerHTML=list.length?list.map(x=>`<div class="row"><span title="${esc(x[label])}">${esc(x[label])}</span><div class="track"><div class="fill" style="width:${x.visits/max*100}%"></div></div><span class="num">${x.visits}</span></div>`).join(""):"<p>Abhi data nahi.</p>";
}
async function load(){
	$("err").textContent="";
	const api=$("api").value.replace(/\/+$/,""),key=$("key").value;
	try{
		const r=await fetch(`${api}/api/analytics?days=${days}`,{headers:{"x-analytics-key":key}});
		if(!r.ok)throw new Error(r.status===403?"Key galat hai.":"Server error "+r.status);
		const d=await r.json();
		try{sessionStorage.setItem("sr_api",api);sessionStorage.setItem("sr_key",key)}catch{}
		$("out").hidden=false;
		$("lead").textContent=`Pichhle ${days} din`;
		const s=d.sources[0];
		$("topsrc").textContent=s?s.source:"Abhi koi visit nahi";
		$("sub").textContent=s?`sabse zyada traffic yahin se (${s.visits} visits). Total ${d.visits} visits, ${d.visitors} unique visitors.`:"Track script site par lagao.";
		rows($("sources"),d.sources,"source");rows($("pages"),d.pages,"path");rows($("countries"),d.countries,"country");rows($("devices"),d.devices,"device");
		const m=Math.max(1,...d.daily.map(x=>x.visits));
		$("daily").innerHTML=d.daily.map(x=>`<i title="${x.day}: ${x.visits}" style="height:${x.visits/m*100}%"></i>`).join("");
	}catch(e){$("err").textContent=e.message}
}
$("range").innerHTML=[1,7,30,90].map(n=>`<button data-d="${n}" class="${n===7?"on":""}">${n===1?"Aaj":n+" din"}</button>`).join("");
$("range").onclick=e=>{const b=e.target.closest("button");if(!b)return;days=+b.dataset.d;[...$("range").children].forEach(x=>x.classList.toggle("on",x===b));load()};
$("go").onclick=load;
if($("key").value)load();
</script>
</body>
</html>
